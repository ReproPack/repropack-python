name: python-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical fixtures
        uses: actions/checkout@v4
        with:
          repository: ReproPack/repropack-core
          path: repropack-core
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package build tools
        run: python -m pip install --upgrade pip build
      - name: Install project for tests
        run: python -m pip install --no-deps -e .
      - name: Test and compile
        env:
          REPROPACK_CORE: ${{ github.workspace }}/repropack-core
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Package build
        run: python -m build
      - name: Install wheel and check package
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - name: Documentation foundation
        run: test -f README.md && test -f docs/ARCHITECTURE.md && test -f PROJECT_STATE.md
